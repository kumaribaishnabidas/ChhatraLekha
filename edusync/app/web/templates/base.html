<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}EduSynC - APAAR ID Platform{% endblock %}</title>
  <meta name="description" content="APAAR ID student data management, automated validation, anomaly detection, signed credential verification and regulatory reporting for AICTE-approved institutions.">
  <meta name="theme-color" content="#14246B">
  <link rel="icon" href="/static/images/favicon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/static/images/icon-192.png">
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="/">
      <img src="/static/images/edusync-lockup.png" alt="EduSynC"
           onerror="this.style.display='none';this.nextElementSibling.style.display='inline'">
      <span class="fallback" style="display:none">EduSynC</span>
    </a>
    <nav>
      <a href="/dashboard" class="hide-sm">Directorate</a>
      <a href="/verify" class="hide-sm">Verify</a>
      <a href="/docs" class="hide-sm">API</a>
      <a href="/login" class="chip">Sign in</a>
    </nav>
  </div>
</header>

<main class="wrap {% block wrapclass %}{% endblock %}">
  {% block content %}{% endblock %}
</main>

<footer class="site">
  <p><strong>EduSynC</strong> &mdash; APAAR ID Student Data Management &amp; Verification Platform.
     Synthetic demonstration data only. &copy; {{ app_name or 'EduSynC' }}</p>
</footer>

<script src="/static/js/app.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
