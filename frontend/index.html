    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2F57D6" />
    <script>
      /* Apply the theme before the module graph loads: no flash of light UI. */
      (function () {
        try {
          var choice = localStorage.getItem('chhatralekha.theme') || 'system';
          var dark = choice === 'dark' || (choice === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', dark ? '#0B1437' : '#2F57D6');
        } catch (_) { document.documentElement.setAttribute('data-theme', 'light'); }
      })();
    </script>
    <meta
