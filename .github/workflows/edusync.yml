name: ChhatraLekha

on:
  push:
    branches: [main]
    paths:
      - "edusync/**"
      - "frontend/**"
      - "Acadentrix/**"
      - "docker-compose.yml"
      - ".github/workflows/edusync.yml"
  pull_request:
    branches: [main]
    paths:
      - "edusync/**"
      - "frontend/**"
      - "Acadentrix/**"
      - "docker-compose.yml"
      - ".github/workflows/edusync.yml"

concurrency:
  group: edusync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: edusync
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: edusync/requirements.txt

      - name: Install the dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with ruff
        run: |
          pip install ruff
          ruff check app tests

      - name: Run the test-suite
        run: pytest -q --junitxml=pytest-report.xml

      - name: Upload the test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report-python-${{ matrix.python-version }}
          path: edusync/pytest-report.xml
          if-no-files-found: ignore

  frontend:
    name: Frontend (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22"]

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the dependencies
        run: npm install --no-audit --no-fund

      - name: Run the unit tests
        run: npm test

      - name: Build the production bundle
        run: npm run build

      - name: Upload the build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-node-${{ matrix.node-version }}
          path: frontend/dist
          if-no-files-found: ignore

  android:
    name: Android (Java 17, Gradle)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Acadentrix

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run Core unit tests
        run: ./gradlew :core:test --no-daemon

      - name: Compile Android app and build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Android test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-core-test-results
          path: Acadentrix/core/build/test-results/test
          if-no-files-found: ignore

  container:
    name: Container image
    runs-on: ubuntu-latest
    needs: [backend, frontend, android]

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Build the image
        run: docker build -f edusync/Dockerfile -t edusync:${{ github.sha }} .

      - name: Start MongoDB and the API
        run: |
          docker compose up -d mongodb
          # The image is built above, so compose is pointed at it.
          docker compose up -d --no-build api || true
          for attempt in $(seq 1 40); do
            if curl -fsS http://localhost:8000/health; then
              echo ""
              echo "health check passed"
              break
            fi
            sleep 3
          done
          curl -fsS http://localhost:8000/health
          echo ""
          echo "the React frontend is served from the same origin:"
          curl -fsS http://localhost:8000/ | head -c 200

      - name: Show the logs on failure
        if: failure()
        run: docker compose logs api || true

      - name: Tear down
        if: always()
        run: docker compose down -v || true
