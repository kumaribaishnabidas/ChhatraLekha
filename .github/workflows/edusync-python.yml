name: EduSynC - Python CI

on:
  push:
    branches: [main]
    paths:
      - "edusync/**"
      - ".github/workflows/edusync-python.yml"
  pull_request:
    branches: [main]
    paths:
      - "edusync/**"
      - ".github/workflows/edusync-python.yml"

concurrency:
  group: edusync-python-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: edusync

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: edusync/requirements.txt

      - name: Install the dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "sqlalchemy[asyncio]" greenlet
          pip install -r requirements.txt

      - name: Lint with ruff
        run: |
          pip install ruff
          ruff check app tests

      - name: Run the test-suite
        run: pytest -q --junitxml=pytest-report.xml

      - name: Upload the test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report-python-${{ matrix.python-version }}
          path: edusync/pytest-report.xml
          if-no-files-found: ignore

  build:
    name: Build the container image
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: edusync

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Build the Docker image
        run: docker build -t edusync:${{ github.sha }} .

      - name: Smoke-test the container
        run: |
          docker run -d --name edusync -p 8000:8000 \
            -e ENVIRONMENT=dev \
            -e DATABASE_URL=sqlite+aiosqlite:////data/edusync.db \
            edusync:${{ github.sha }}
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8000/api/health; then
              echo "health check passed"
              break
            fi
            sleep 2
          done
          curl -fsS http://localhost:8000/api/health
          docker rm -f edusync
